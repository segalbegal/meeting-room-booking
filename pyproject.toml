[project]
name = "meeting-room-booking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shahar Sigal", email = "sigalos10@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
meeting-room-booking = "meeting_room_booking:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["meeting_room_booking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
